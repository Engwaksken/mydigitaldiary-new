<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>You&rsquo;re offline &middot; My Digital Diary</title>
    <!-- Keep this page self-contained: it must work without network access. -->
    <style>
        *, *::before, *::after { box-sizing: border-box; }

        html, body {
            min-height: 100%;
            margin: 0;
        }

        body {
            min-height: 100vh;
            min-height: 100svh;
            display: grid;
            place-items: center;
            padding: 24px 16px;
            background: linear-gradient(160deg, #009688 0%, #00695C 100%);
            color: #0f172a;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                "Helvetica Neue", Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        .pm-offline-card {
            width: 100%;
            max-width: 26rem;
            padding: 2rem clamp(1.25rem, 6vw, 2rem);
            border-radius: 1.5rem;
            background: #ffffff;
            box-shadow: 0 1.5rem 3rem rgba(0, 53, 47, 0.28);
            text-align: center;
        }

        .offline-mark {
            display: grid;
            place-items: center;
            width: 4rem;
            height: 4rem;
            margin: 0 auto;
            border-radius: 1.25rem;
            background: #e6f4f2;
            color: #00897b;
        }

        h1 {
            margin: 1.25rem 0 0.5rem;
            font-size: clamp(1.375rem, 5vw, 1.625rem);
            line-height: 1.3;
            color: #0f172a;
        }

        p {
            margin: 0 0 1rem;
            font-size: 1rem;
            line-height: 1.6;
            color: #475569;
        }

        .pm-offline-note {
            margin-top: 1.25rem;
            padding-top: 1rem;
            border-top: 1px solid #e2e8f0;
            font-size: 0.875rem;
            color: #64748b;
        }

        button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            width: 100%;
            padding: 0.75rem 1.25rem;
            border: 0;
            border-radius: 0.75rem;
            background: #00897B;
            color: #ffffff;
            font: inherit;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover { background: #00695C; }
        button:focus-visible { outline: 3px solid #73BEB6; outline-offset: 2px; }

        @media (prefers-reduced-motion: reduce) {
            * { animation: none !important; transition: none !important; }
        }
    </style>
</head>
<body>
    <main class="pm-offline-card">
        <div class="offline-mark" aria-hidden="true">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 7.5A2.5 2.5 0 0 1 5.5 5h13A2.5 2.5 0 0 1 21 7.5v9a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 16.5z"></path>
                <path d="M7 9h10M7 13h6"></path>
                <path d="m4 4 16 16"></path>
            </svg>
        </div>
        <h1>You&rsquo;re offline</h1>
        <p>
            My Digital Diary needs a connection to load your diary, so this page
            can&rsquo;t show your entries right now.
        </p>
        <button type="button" onclick="window.location.reload()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M21 12a9 9 0 1 1-2.64-6.36"></path>
                <path d="M21 3v6h-6"></path>
            </svg>
            Try again
        </button>
        <p class="pm-offline-note">
            Nothing is saved offline. Your diary is stored on the server, so
            reconnecting brings back everything exactly as it was.
        </p>
    </main>
</body>
</html>
